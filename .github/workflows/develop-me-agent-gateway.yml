name: develop-me enterprise agent gateway
on:
  push:
    branches: [develop-me]
    paths:
      - 'examples/enterprise-agent-gateway/**'
      - '.github/workflows/develop-me-agent-gateway.yml'
  workflow_dispatch:
jobs:
  gateway-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gateway integration tests (mock Dify)
        working-directory: examples/enterprise-agent-gateway
        run: npm test
  langgraph-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install LangGraph demo dependencies
        working-directory: examples/enterprise-agent-gateway/langgraph-demo
        run: npm install --no-audit --no-fund
      - name: Test approval and resume
        working-directory: examples/enterprise-agent-gateway/langgraph-demo
        run: npm test
